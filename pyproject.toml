[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heathen-ledger"
version = "0.1.0"
description = "A Telegram bot to track and settle group expenses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv~=1.0",
    "pre-commit~=3.5",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.11.0",
    "google-genai>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "UP",   # pyupgrade
    "ERA",  # eradicate (commented-out code)
]
ignore = [
    "E501",   # line length handled by ruff-format
    "UP038",  # isinstance with union instead of tuple (deprecated in Ruff, tuple is faster)
]
