[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heathen-ledger"
version = "0.1.0"
description = "A Telegram bot to track and settle group expenses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv~=1.0",
    "pre-commit~=3.5",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.11.0",
    "google-genai>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "UP",   # pyupgrade
    "ERA",  # eradicate (commented-out code)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort (import sorting)
    "C901", # mccabe (cyclomatic complexity)
    "ARG",  # flake8-unused-arguments
    "ASYNC",# flake8-async (asyncio anti-patterns)
    "A",    # flake8-builtins (shadowing builtins)
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print (disallow stray print statements)
    "FA",   # flake8-future-annotations (consistent __future__ annotations)
    "RSE",  # flake8-raise (clean raise statements)
    "PGH",  # pygrep-hooks (specific type: ignore / noqa)
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific rules
    "FLY",  # flynt (f-strings)
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PERF", # perflint (performance anti-patterns)
]
ignore = [
    "E501",   # line length handled by ruff-format
    "B905",   # zip() without explicit strict= parameter
    "RUF001", # allow ambiguous unicode (emojis like ℹ️, 🧾, etc.)
    "RUF002", # allow ambiguous unicode in docstrings
    "RUF003", # allow ambiguous unicode in comments
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
".vulture_whitelist.py" = ["B018"]


[tool.vulture]
min_confidence = 60
paths = ["src", "tests", ".vulture_whitelist.py"]
exclude = ["*/.#*"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
check_untyped_defs = true
